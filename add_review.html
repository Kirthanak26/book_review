{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">

    <h3 class="mb-4">➕ Add a Book Review</h3>

    <form action="/add-review" method="post">

        <div class="mb-3">
            <label class="form-label">Book Title</label>
            <input type="text" name="book_title" class="form-control" placeholder="Enter book title" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Review</label>
            <textarea name="review_text" class="form-control" rows="4" placeholder="Write your thoughts..." required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Rating (1–10)</label>
            <input type="number" name="rating" min="1" max="10" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Submit Review
        </button>

    </form>

    <a href="/" class="btn btn-outline-secondary mt-3 w-100">
        Back
    </a>

</div>

{% endblock %}
